[project]
name = "habit-tracker-backend"
version = "0.1.0"
description = "FastAPI + SQLite backend for the habit tracker"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
